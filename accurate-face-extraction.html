<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accurate Head Extraction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: none;
        }

        #outputContainer {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .extractedHead {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .extractedHead img {
            width: 200px;
            height: 200px;
            object-fit: cover;
        }

        #status {
            margin-top: 10px;
            font-style: italic;
        }

        #controls {
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Accurate Head Extraction</h1>
        <input type="file" id="upload" accept="image/*">
        <canvas id="canvas"></canvas>
        <div id="outputContainer"></div>
        <p id="status"></p>
    </div>

    <script src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script>
        const upload = document.getElementById('upload');
        const canvas = document.getElementById('canvas');
        const outputContainer = document.getElementById('outputContainer');
        const statusEl = document.getElementById('status');

        async function init() {
            setStatus('Loading face detection and landmark models...');
            await faceapi.nets.tinyFaceDetector.loadFromUri('https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights');
            await faceapi.nets.faceLandmark68Net.loadFromUri('https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights');
            setStatus('Models loaded. Ready to process images.');
        }

        init();

        function setStatus(message) {
            statusEl.textContent = message;
        }

        function handleError(message) {
            setStatus(message);
            console.error(message);
        }

        upload.addEventListener('change', async function (event) {
            const file = event.target.files[0];
            if (!file) return;

            setStatus('Processing image...');
            outputContainer.innerHTML = '';

            const img = await createImageBitmap(file);
            processImage(img);
        });

        async function processImage(img) {
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);

            const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 });
            const detections = await faceapi.detectAllFaces(canvas, options).withFaceLandmarks();

            if (detections && detections.length > 0) {
                setStatus(`Detected ${detections.length} face(s). Extracting heads...`);
                detections.forEach((detection, index) => {
                    const landmarks = detection.landmarks.positions;
                    extractHead(detection.detection.box, landmarks, img.width, img.height, index);
                });
            } else {
                handleError('No faces detected. Please try another image.');
            }
        }

function extractHead(box, landmarks, imgWidth, imgHeight, index) {
    const leftEyebrow = landmarks.slice(17, 22);
    const rightEyebrow = landmarks.slice(22, 27);
    const jawline = landmarks.slice(0, 17);
    const foreheadTop = landmarks.filter((p, i) => i >= 19 && i <= 24);

    // Calculate initial bounding box vertices
    const minX = Math.min(...foreheadTop.map(p => p.x), ...jawline.map(p => p.x));
    const maxX = Math.max(...foreheadTop.map(p => p.x), ...jawline.map(p => p.x));
    const minY = Math.min(...foreheadTop.map(p => p.y));
    const maxY = Math.max(...jawline.map(p => p.y));

    // Calculate face dimensions
    const faceHeight = maxY - minY;
    const faceWidth = maxX - minX;
    const faceCenterX = minX + (faceWidth / 2);

    // Fine-tuned spacing ratios
    const topSpaceRatio = 0.67;    // Reduced from 1.2 for less space above
    const bottomSpaceRatio = 0.13;  // Increased from 0.3 for more space below

    // Calculate vertical position with adjusted ratios
    const totalSpaceRatio = topSpaceRatio + 1 + bottomSpaceRatio; // 1 is for the face itself
    const faceCenterY = minY + (faceHeight / 2);
    
    // Calculate desired dimensions
    const desiredHeight = faceHeight * totalSpaceRatio;
    const desiredWidth = desiredHeight; // Keep it square

    // Calculate crop boundaries with adjusted vertical positioning
    const verticalOffset = (topSpaceRatio - bottomSpaceRatio) * faceHeight / 2;
    let cropLeft = faceCenterX - (desiredWidth / 2);
    let cropRight = faceCenterX + (desiredWidth / 2);
    let cropTop = faceCenterY - (desiredHeight / 2) - verticalOffset;
    let cropBottom = faceCenterY + (desiredHeight / 2) - verticalOffset;

    // Adjust crop boundaries to stay within image bounds
    if (cropLeft < 0) {
        cropRight = Math.min(desiredWidth, imgWidth);
        cropLeft = 0;
    }
    if (cropRight > imgWidth) {
        cropLeft = Math.max(0, imgWidth - desiredWidth);
        cropRight = imgWidth;
    }
    if (cropTop < 0) {
        cropBottom = Math.min(desiredHeight, imgHeight);
        cropTop = 0;
    }
    if (cropBottom > imgHeight) {
        cropTop = Math.max(0, imgHeight - desiredHeight);
        cropBottom = imgHeight;
    }

    // Calculate final dimensions ensuring they're equal (square)
    const finalSize = Math.min(
        cropRight - cropLeft,
        cropBottom - cropTop,
        desiredWidth,
        desiredHeight
    );

    // Recenter the crop box while maintaining the square shape
    const finalLeft = Math.max(0, Math.min(
        faceCenterX - (finalSize / 2),
        imgWidth - finalSize
    ));
    
    // Adjust vertical position while maintaining adjusted spacing
    const finalTop = Math.max(0, Math.min(
        faceCenterY - (finalSize / 2) - verticalOffset,
        imgHeight - finalSize
    ));

    // Create temporary canvas for the crop
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = finalSize;
    tempCanvas.height = finalSize;
    const tempCtx = tempCanvas.getContext('2d');

    // Draw the cropped region
    tempCtx.drawImage(
        canvas,
        finalLeft, finalTop, finalSize, finalSize,  // Source coordinates
        0, 0, finalSize, finalSize                  // Destination coordinates
    );

    resizeAndDisplay(tempCanvas, index);
}

        function resizeAndDisplay(canvas, index) {
            const maxSize = 99 * 1024; // 99KB
            let quality = 0.99;
            let scale = 1;

            const resizeAndCheck = () => {
                const scaledCanvas = document.createElement('canvas');
                scaledCanvas.height = canvas.height * scale;
                scaledCanvas.width = scaledCanvas.height;
                const ctx = scaledCanvas.getContext('2d');
                ctx.drawImage(canvas, 0, 0, scaledCanvas.width, scaledCanvas.height);

                scaledCanvas.toBlob(blob => {
                    if (blob.size > maxSize) {
                        if (quality > 0.5) {
                            quality -= 0.05;
                        } else {
                            scale *= 0.9;
                        }
                        resizeAndCheck();
                    } else {
                        displayOutput(blob, index);
                    }
                }, 'image/jpeg', quality);
            };

            resizeAndCheck();
        }

        function displayOutput(blob, index) {
            const url = URL.createObjectURL(blob);
            const container = document.createElement('div');
            container.className = 'extractedHead';

            const img = document.createElement('img');
            img.src = url;
            img.alt = `Extracted Head ${index + 1}`;

            const size = document.createElement('p');
            size.textContent = `Size: ${(blob.size / 1024).toFixed(2)} KB`;

            container.appendChild(img);
            container.appendChild(size);
            outputContainer.appendChild(container);

            if (index === 0) {
                setStatus('Heads extracted successfully.');
            }
        }
    </script>
</body>

</html>
